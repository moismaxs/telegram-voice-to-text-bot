services:
  bot:
    build: .
    env_file: .env
    environment:
      TMP_DIR: /tmp/voices
    volumes:
      # кэш моделей whisper, чтобы не качать при каждом рестарте
      - whisper-cache:/root/.cache/huggingface
    restart: unless-stopped
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "pidof python || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whisper-cache:
